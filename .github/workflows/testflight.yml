# Підписує застосунок «Нитка» для iOS і відправляє його в TestFlight.
# Запускається при кожній зміні застосунку в main і вручну (Actions → TestFlight → Run workflow).
# Потрібні секрети репозиторію: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (вміст файлу .p8).
# Підпис автоматичний: Xcode сам створює сертифікат і профілі через ключ App Store Connect API.
name: TestFlight

on:
  push:
    branches: [main]
    paths: ["app/**", "src/**", "public/**", "build.js", "release/VERSION", ".github/workflows/testflight.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: testflight
  cancel-in-progress: true   # у черзі лишається тільки найновіша зміна

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "::notice::Секрети Apple ще не додані — TestFlight пропущено."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chk.outputs.ok == 'yes'
        uses: actions/checkout@v4
      - if: steps.chk.outputs.ok == 'yes'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.chk.outputs.ok == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and sync
        if: steps.chk.outputs.ok == 'yes'
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node ../build.js app
          npx cap sync ios
      - name: Add widget extension
        if: steps.chk.outputs.ok == 'yes'
        working-directory: app/ios/App
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby scripts/add_widget.rb
      - name: Archive (signed)
        if: steps.chk.outputs.ok == 'yes'
        working-directory: app/ios/App
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          VERSION=$(tr -d ' \n' < ../../../release/VERSION)
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          echo "Версія $VERSION, збірка $BUILD"
          xcodebuild -version | tee "$RUNNER_TEMP/build.log"
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Nytka.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" 2>&1 | tee -a "$RUNNER_TEMP/build.log" | grep -E "error|ARCHIVE|Signing" || true
          test -d "$RUNNER_TEMP/Nytka.xcarchive"
      - name: Upload to TestFlight
        if: steps.chk.outputs.ok == 'yes'
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nytka.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee -a "$RUNNER_TEMP/build.log" | grep -E "error|EXPORT|Upload|upload" || true
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" "$RUNNER_TEMP/build.log"
      - name: Save log to ci-testflight branch
        if: always() && steps.chk.outputs.ok == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          mkdir -p "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci"
          git init -q -b ci-testflight
          echo "$STATUS $GITHUB_SHA build $((100 + GITHUB_RUN_NUMBER)) $(date -u +%FT%TZ)" > status.txt
          tail -n 300 "$RUNNER_TEMP/build.log" > build-tail.log 2>/dev/null || echo "no log" > build-tail.log
          grep -nE "error:|error |FAILED|No profiles|requires a provisioning" -B 2 -A 4 "$RUNNER_TEMP/build.log" > errors.log 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "testflight $STATUS ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-testflight
